# Not used by default in local dev — docker-compose.yml exposes the `web`
# service directly on localhost:8000, which is simpler for day-to-day work.
#
# This file exists so you can optionally test the exact Nginx routing you'll
# run in production, without HTTPS. To use it:
#   docker run --rm -p 8080:80 -v $(pwd)/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro --network site-project_default nginx:1.27-alpine
# then visit http://localhost:8080

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
