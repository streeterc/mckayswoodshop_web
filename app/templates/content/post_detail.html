{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
  <section class="shell" style="max-width: 42rem">
    <article>
      <div class="meta">{{ post.date }}{% if post.tags %} &middot; {{ post.tags | join(', ') }}{% endif %}</div>
      <div class="accent-line"></div>
      <h1>{{ post.title }}</h1>
      <div class="post-body">
        {{ post.html | safe }}
      </div>
    </article>
    <p class="mt-4 divider-top">
      <a href="/blog">&larr; Back to all posts</a>
    </p>
  </section>
{% endblock %}
