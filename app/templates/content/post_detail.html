{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
  <article>
    <h1>{{ post.title }}</h1>
    <small>{{ post.date }}</small>
    <div class="post-body">
      {{ post.html | safe }}
    </div>
  </article>
  <p><a href="/blog">&larr; Back to all posts</a></p>
{% endblock %}
