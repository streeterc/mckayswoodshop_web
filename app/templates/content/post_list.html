{% extends "base.html" %}
{% block title %}Blog{% endblock %}
{% block content %}
  <h1>Blog</h1>
  {% for post in posts %}
    <div class="card">
      <h3><a href="/blog/{{ post.slug }}">{{ post.title }}</a></h3>
      <p>{{ post.summary }}</p>
      <small>{{ post.date }} {% if post.tags %}&middot; {{ post.tags | join(', ') }}{% endif %}</small>
    </div>
  {% else %}
    <p>No posts yet.</p>
  {% endfor %}
{% endblock %}
