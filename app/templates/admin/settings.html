{% extends "admin/_base.html" %}
{% block title %}Settings — Admin{% endblock %}
{% block content %}
  <h1>Store Settings</h1>
  <form method="post" action="/admin/settings" class="card">
    <label for="domestic_country_code">Domestic country code (2-letter, e.g. US)</label>
    <input type="text" name="domestic_country_code" id="domestic_country_code" maxlength="2" value="{{ settings.domestic_country_code }}">

    <label for="domestic_shipping_cents">Domestic flat shipping rate (in cents)</label>
    <input type="number" name="domestic_shipping_cents" id="domestic_shipping_cents" value="{{ settings.domestic_shipping_cents }}">

    <label for="intl_shipping_cents">International flat shipping rate (in cents)</label>
    <input type="number" name="intl_shipping_cents" id="intl_shipping_cents" value="{{ settings.intl_shipping_cents }}">

    <button class="btn" type="submit" style="margin-top:1rem;">Save</button>
  </form>
{% endblock %}
