<form hx-post="/admin/variants/{{ variant.id }}/dimensions" hx-target="#dims-{{ variant.id }}" hx-swap="innerHTML" class="inline-form">
  <input type="number" step="0.1" min="0.1" name="weight_oz" value="{{ variant.weight_oz }}" aria-label="Weight, ounces" title="Weight (oz)" class="input-narrower">
  <input type="number" step="0.1" min="0.1" name="length_in" value="{{ variant.length_in }}" aria-label="Length, inches" title="Length (in)" class="input-narrower">
  <input type="number" step="0.1" min="0.1" name="width_in" value="{{ variant.width_in }}" aria-label="Width, inches" title="Width (in)" class="input-narrower">
  <input type="number" step="0.1" min="0.1" name="height_in" value="{{ variant.height_in }}" aria-label="Height, inches" title="Height (in)" class="input-narrower">
  <button class="btn btn-ghost btn-sm" type="submit">Save</button>
</form>
