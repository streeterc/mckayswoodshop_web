{% extends "base.html" %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
  <a href="/shop">&larr; Back to shop</a>
  <h1>{{ product.name }}</h1>
  {% if product.image_path %}
    <img src="{{ product.image_path }}" alt="{{ product.name }}" style="max-width:100%;border-radius:6px;">
  {% endif %}
  <p>{{ product.description }}</p>

  <form hx-post="/shop/cart/add" hx-target="#cart-feedback" hx-swap="innerHTML" class="inline">
    <label for="variant_id">Variant</label>
    <select name="variant_id" id="variant_id">
      {% for v in product.variants %}
        <option value="{{ v.id }}" {% if v.stock_count == 0 %}disabled{% endif %}>
          {{ v.label }} — ${{ "%.2f"|format(v.price_cents() / 100) }}
          {% if v.stock_count == 0 %}(out of stock){% endif %}
        </option>
      {% endfor %}
    </select>
    <label for="quantity">Qty</label>
    <input type="number" name="quantity" id="quantity" value="1" min="1" max="99" style="width:70px;">
    <button class="btn" type="submit">Add to cart</button>
  </form>
  <div id="cart-feedback"></div>
{% endblock %}
