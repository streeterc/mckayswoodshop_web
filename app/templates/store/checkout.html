{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
  <h1>Checkout</h1>
  <p>Guest checkout — no account needed. You'll get an order confirmation email with a lookup link.</p>

  <form method="post" action="/checkout">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" required>

    <label for="name">Full name</label>
    <input type="text" name="name" id="name" required>

    <label for="address_line1">Address line 1</label>
    <input type="text" name="address_line1" id="address_line1" required>

    <label for="address_line2">Address line 2 (optional)</label>
    <input type="text" name="address_line2" id="address_line2">

    <label for="city">City</label>
    <input type="text" name="city" id="city" required>

    <label for="state">State / Province (optional)</label>
    <input type="text" name="state" id="state">

    <label for="postal_code">Postal code</label>
    <input type="text" name="postal_code" id="postal_code" required>

    <label for="country">Country (2-letter code, e.g. US, CA, GB)</label>
    <input type="text" name="country" id="country" maxlength="2" required style="text-transform:uppercase;">

    <label>Payment method</label>
    <div>
      <label style="font-weight:normal;"><input type="radio" name="payment_method" value="stripe" checked> Card (Stripe)</label>
      {% if crypto_enabled %}
        <label style="font-weight:normal;"><input type="radio" name="payment_method" value="coinbase"> Crypto (Coinbase Commerce)</label>
      {% endif %}
    </div>

    <button class="btn" type="submit" style="margin-top:1.2rem;">Pay</button>
  </form>
{% endblock %}
