services:
  db:
    ports: []   # remove public port mapping entirely — only reachable inside the Docker network
    env_file:
      - .env.prod

  web:
    env_file:
      - .env.prod
    # No bind mounts / hot reload in prod — run the image as built, except
    # for a named volume over the product-photo upload directory: admin
    # product-image uploads (app/routers/admin.py) write here at runtime,
    # and without a persistent volume those writes would live only in the
    # running container and vanish on the next `docker compose up --build`
    # redeploy. Docker seeds the volume from the image's existing contents
    # (the sample product photos already baked in) on its first mount.
    volumes:
      - product_images:/code/app/static/img/products
    ports: []    # not exposed directly; Nginx proxies to it over the internal network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot_www:
  certbot_certs:
  product_images:
