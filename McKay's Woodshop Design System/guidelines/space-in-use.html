<!-- @dsCard group="Spacing" viewport="700x160" name="Padding in use" subtitle="Card 20px, large card 28px, field 9×12px." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);padding:16px;font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;padding:5px 6px;font:500 10px/1 var(--font-mono);letter-spacing:.02em}.lbls{display:flex;gap:0;margin-top:5px}.lbls>div{flex:1;font:500 9px/1.3 var(--font-mono);color:var(--text-muted);padding:0 6px}.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:flex;gap:14px">
 <div style="flex:1;background:var(--surface-card);border:1px solid var(--line-hairline);border-radius:var(--radius-card);padding:var(--card-pad)"><div class="cap">card-pad</div><div style="font:var(--type-body-sm);color:var(--text-body);margin-top:6px">20px on all sides.</div></div>
 <div style="flex:1;background:var(--surface-card);border:1px solid var(--line-hairline);border-radius:var(--radius-card);padding:var(--card-pad-lg)"><div class="cap">card-pad-lg</div><div style="font:var(--type-body-sm);color:var(--text-body);margin-top:6px">28px, for feature cards.</div></div>
 <div style="flex:1"><div class="cap">field</div><div style="margin-top:6px;height:40px;border:1px solid var(--line-default);border-radius:var(--radius-field);display:flex;align-items:center;padding:0 var(--field-pad-x);font:var(--type-body-sm);color:var(--text-muted)">9 × 12 px</div></div>
</div></body></html>
