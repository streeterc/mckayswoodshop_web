<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Moss, amber and barn red — each with a wash for backgrounds." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);padding:16px;font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;padding:5px 6px;font:500 10px/1 var(--font-mono);letter-spacing:.02em}.lbls{display:flex;gap:0;margin-top:5px}.lbls>div{flex:1;font:500 9px/1.3 var(--font-mono);color:var(--text-muted);padding:0 6px}.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div><div style="height:44px;background:var(--status-success)"></div><div style="height:22px;background:var(--status-success-wash)"></div><div style="font:500 10px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px">Success · on schedule<br>status-success</div></div><div><div style="height:44px;background:var(--status-warning)"></div><div style="height:22px;background:var(--status-warning-wash)"></div><div style="font:500 10px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px">Warning · waiting<br>status-warning</div></div><div><div style="height:44px;background:var(--status-danger)"></div><div style="height:22px;background:var(--status-danger-wash)"></div><div style="font:500 10px/1.4 var(--font-mono);color:var(--text-muted);margin-top:6px">Danger · blocked<br>status-danger</div></div></div></body></html>
