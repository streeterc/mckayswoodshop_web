<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);padding:16px;font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;padding:5px 6px;font:500 10px/1 var(--font-mono);letter-spacing:.02em}.lbls{display:flex;gap:0;margin-top:5px}.lbls>div{flex:1;font:500 9px/1.3 var(--font-mono);color:var(--text-muted);padding:0 6px}.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="font:500 11px/2 var(--font-mono);color:var(--text-body)">
 <div>instant 80ms &nbsp;·&nbsp; fast 140ms &nbsp;·&nbsp; base 200ms &nbsp;·&nbsp; slow 320ms &nbsp;·&nbsp; reveal 560ms</div>
 <div style="color:var(--text-muted)">ease-out cubic-bezier(.16,.84,.44,1) — enters, hovers</div>
 <div style="color:var(--text-muted)">ease-in-out cubic-bezier(.45,0,.25,1) — moves, reorders</div>
 <div style="color:var(--text-muted)">no spring, no overshoot, no scale-up on hover</div>
</div></body></html>
