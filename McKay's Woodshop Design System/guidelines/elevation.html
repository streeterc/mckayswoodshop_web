<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);padding:16px;font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;padding:5px 6px;font:500 10px/1 var(--font-mono);letter-spacing:.02em}.lbls{display:flex;gap:0;margin-top:5px}.lbls>div{flex:1;font:500 9px/1.3 var(--font-mono);color:var(--text-muted);padding:0 6px}.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:flex;gap:18px">
<div style="text-align:center"><div style="width:130px;height:62px;background:#fff;border:1px solid var(--line-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-xs)"></div><div style="font:500 10px/1.8 var(--font-mono);color:var(--text-muted)">shadow-xs</div></div><div style="text-align:center"><div style="width:130px;height:62px;background:#fff;border:1px solid var(--line-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><div style="font:500 10px/1.8 var(--font-mono);color:var(--text-muted)">shadow-sm</div></div><div style="text-align:center"><div style="width:130px;height:62px;background:#fff;border:1px solid var(--line-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><div style="font:500 10px/1.8 var(--font-mono);color:var(--text-muted)">shadow-md</div></div><div style="text-align:center"><div style="width:130px;height:62px;background:#fff;border:1px solid var(--line-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><div style="font:500 10px/1.8 var(--font-mono);color:var(--text-muted)">shadow-lg</div></div></div></body></html>
