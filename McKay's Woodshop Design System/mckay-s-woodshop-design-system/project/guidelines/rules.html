<!-- @dsCard group="Surfaces" viewport="700x150" name="Rules & borders" subtitle="1px hairline, 2px emphasis, 48×3px copper section rule." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);padding:16px;font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;padding:5px 6px;font:500 10px/1 var(--font-mono);letter-spacing:.02em}.lbls{display:flex;gap:0;margin-top:5px}.lbls>div{flex:1;font:500 9px/1.3 var(--font-mono);color:var(--text-muted);padding:0 6px}.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:16px">
 <div><div style="height:1px;background:var(--line-hairline)"></div><div style="font:500 10px/1.8 var(--font-mono);color:var(--text-muted)">1px sand-200 — table rows, card edges</div></div>
 <div><div style="height:1px;background:var(--line-default)"></div><div style="font:500 10px/1.8 var(--font-mono);color:var(--text-muted)">1px sand-300 — form controls</div></div>
 <div><div style="height:2px;background:var(--line-strong)"></div><div style="font:500 10px/1.8 var(--font-mono);color:var(--text-muted)">2px forest-700 — secondary buttons, emphasis</div></div>
 <div><div style="width:48px;height:3px;background:var(--line-accent)"></div><div style="font:500 10px/1.8 var(--font-mono);color:var(--text-muted)">48 × 3px copper — the section rule above a display heading</div></div>
</div></body></html>
