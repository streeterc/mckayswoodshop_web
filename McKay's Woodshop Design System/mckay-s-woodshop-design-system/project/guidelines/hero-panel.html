<!-- @dsCard group="Surfaces" viewport="700x220" name="Hero text panel" subtitle="Full-bleed photo, undimmed. Text on one flat forest panel — no gradient, no blur." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);padding:16px;font:var(--type-body)}.photo{position:relative;height:150px;background:var(--forest-600);border-radius:var(--radius-image);display:flex;align-items:center;padding:0 20px;overflow:hidden}.photo:after{content:"PHOTO — UNDIMMED";position:absolute;right:14px;bottom:10px;font:500 9px/1 var(--font-mono);letter-spacing:var(--tracking-label);color:var(--forest-300)}.panel{position:relative;z-index:1;width:300px;padding:var(--space-8);background:rgba(11,33,23,.72);border-radius:var(--radius-card)}.eb{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--copper-500)}.rule{width:48px;height:3px;background:var(--line-accent);margin:8px 0}.h{font:var(--weight-regular) var(--text-xl)/1.1 var(--font-display);letter-spacing:var(--tracking-tight);color:var(--text-on-forest)}.spec{margin-top:8px;font:500 10px/1.5 var(--font-mono);color:var(--text-muted)}</style>
</head><body><div class="photo"><div class="panel"><div class="eb">Custom woodworking</div><div class="rule"></div><div class="h">Hi, I'm Eric McKay.</div></div></div>
<div class="spec">rgba(11,33,23,.72) · 24px padding · 5px corners · no border · max 38rem · hero only</div></body></html>
