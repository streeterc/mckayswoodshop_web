<!-- @dsCard group="Type" viewport="700x190" name="Pairing in use" subtitle="Eyebrow, serif headline, sans body, mono spec — the standard stack." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);padding:16px;font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;padding:5px 6px;font:500 10px/1 var(--font-mono);letter-spacing:.02em}.lbls{display:flex;gap:0;margin-top:5px}.lbls>div{flex:1;font:500 9px/1.3 var(--font-mono);color:var(--text-muted);padding:0 6px}.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body><div style="max-width:52ch">
 <div style="font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-accent)">Case study</div>
 <div style="width:48px;height:3px;background:var(--line-accent);margin:12px 0 10px"></div>
 <h2 style="font:var(--type-h2);color:var(--text-heading);letter-spacing:var(--tracking-tight);margin:0">A stair in rift-sawn oak</h2>
 <p style="font:var(--type-body);color:var(--text-body);margin:10px 0 0">Forty-one treads, one log, matched grain from the bottom rise to the landing.</p>
 <div style="font:var(--type-spec);color:var(--text-muted);margin-top:12px">MW-2246 · WHITE OAK · 11 WEEKS</div>
</div></body></html>
